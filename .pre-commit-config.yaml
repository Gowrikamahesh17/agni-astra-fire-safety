repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(data|ai|contract)/
      - id: ruff-format
        files: ^(data|ai|contract)/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^web/.*\.(ts|tsx|js|mjs|css|json)$
        exclude: ^web/public/data/
