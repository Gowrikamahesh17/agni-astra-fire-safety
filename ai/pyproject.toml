[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ffd-ai"
version = "2.0.0"
description = "Flame in Freefall AI layer: summaries, implications and search docs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
